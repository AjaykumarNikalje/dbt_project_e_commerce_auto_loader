name: e_commerce_streaming
version: 1.0.0
config-version: 2
profile: ecommerce_streaming_dbt
require-dbt-version:
- '>=1.10.0'
- <2.0.0
model-paths:
- models
analysis-paths:
- analysis
test-paths:
- tests
seed-paths:
- seeds
macro-paths:
- macros
snapshot-paths:
- snapshots
docs-paths:
- docs
asset-paths:
- assets
target-path: target
packages-install-path: dbt_packages
clean-targets:
- target
- dbt_packages
flags:
  fail_fast: true
  use_colors: true
  send_anonymous_usage_stats: false
query-comment: e_commerce streaming dbt project
quoting:
  database: true
  schema: true
  identifier: true
vars:
  max_order_amount: 100000
  load_mode: incremental
  from_date: null
  to_date: null
models:
  e_commerce_streaming:
    bronze:
      +materialized: streaming_table
      +docs:
        node_color: '#CD7F32'
    silver:
      +materialized: incremental
      +docs:
        node_color: '#C0C0C0'
      +incremental_strategy: merge
      +file_format: delta
      +on_schema_change: fail
    gold:
      +materialized: incremental
      +docs:
        node_color: '#FFD700'
      gld_customer_summary:
        +materialized: materialized_view
      gld_daily_sales:
        +materialized: materialized_view
      +incremental_strategy: merge
      +file_format: delta
      +on_schema_change: fail
seeds:
  e_commerce_streaming:
    +quote_columns: false
    src_customers:
      +column_types:
        customer_id: string
        customer_name: string
        email: string
        country: string
        segment: string
        signup_date: string
        source_inserted_at: string
        source_updated_at: string
        batch_id: string
        operation_type: string
        source_file: string
    src_orders:
      +column_types:
        order_id: string
        customer_id: string
        amount: string
        status: string
        source_inserted_at: string
        source_updated_at: string
        batch_id: string
        operation_type: string
        source_file: string
on-run-start:
- '{% do is_backfill() %}'
